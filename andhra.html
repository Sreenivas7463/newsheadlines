 <!DOCTYPE html>
<html lang="en">
<head>
  <title>Andhra Post</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js" integrity="sha512-qTXRIMyZIFb8iQcfjXWCO8+M5Tbc38Qi5WzdPOYZHIlZpzBHG3L3by84BBBOiRGiEb7KKtAOAs5qYdUiZiQNNQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
	
</head>
<body>

<header>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="javascript:void(0)">Post</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
  </nav>
</header>
  
<div class="container mt-5">
  <div class="row" id="contentdisplay">
   <img src="1475.gif" width="100px" />
  </div>
</div>
<script type="text/javascript">

$(document).ready(function(){
   var urlv = window.location.hash.substr(1);
var url0= "https://sreenewsapi.vercel.app/andhra/"+urlv;
  axios.get(url0, {
    headers: {
      Accept: "application/json",
      "Content-Type": "application/json;charset=UTF-8",
    },}).then(function (response) {
    	                    $('#contentdisplay').html('');
                        console.log(response.data);
                       
                             var contentd = '<div class="col-md-8 mx-auto"><div class="card my-3"><div class="card-header"><h5 class="text-dark fs-4 mb-2">'+response.data[0]['title']+'</h5></div>'

                             contentd += '<div class="card-body"><img src="'+response.data[0]['img']+'" class="img-fluid" /><div class="mt-3 mb-3"><p class="fs-5 font-monospace">'+response.data[0]['articleBody']+'</p></div></div></div></div>';
				 $('#contentdisplay').append(contentd);		    
                        			 
							
                        
                                 
				
						})
						.catch(function (error) {
						    console.log(error);
						});



})
</script>
</body>
</html>
