<div class="container mt-5">

<script type="text/javascript">

$(document).ready(function(){
   var urlv = window.location.hash.substr(1);
var url0= "https://sreenewsapi.vercel.app/andhra/"+urlv;
  axios.get(url0, {
    headers: {
      Accept: "application/json",
      "Content-Type": "application/json;charset=UTF-8",
    },}).then(function (response) {
    	                    $('#contentdisplay').html('');
                        console.log(response.data);
                       
                             var contentd = '<div class="col-md-8 mx-auto"><div class="card my-3"><div class="card-header"><h5 class="text-dark fs-4 mb-2">'+response.data['title']+'</h5></div>'

                             contentd += '<div class="card-body"><div class="mt-3 mb-3">'+response.data['articleBody']+'</div></div></div></div>';
				 $('#contentdisplay').append(contentd);		    
                        			 
							
                        
                                 
				
						})
						.catch(function (error) {
						    console.log(error);
						});



})
</script>
